name: 离线构建与回归

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        check: [build, test, race]
        include:
          - os: macos-latest
            check: test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 检查隔离的已提交源码
        run: python3 scripts/check_clean_checkout.py --check "${{ matrix.check }}"
      - name: 检查快照导出器
        if: matrix.check == 'test'
        run: python3 -B -m unittest discover -s scripts -p test_clean_checkout.py
